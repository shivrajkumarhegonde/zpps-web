{% extends 'template/base.html' %}
{% load static %}

{% block content %}
<head>
  <meta charset="UTF-8">
  <link href="{% static 'css/activities.css' %}" rel="stylesheet">
  <title>Activities</title>
  <style>
    /* Casual and vibrant colors */
    body {
      background-color: #f8f9fa;
      font-family: 'Arial', sans-serif;
    }
    .activities-header {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      padding: 2rem;
      border-radius: 10px;
      margin-bottom: 2rem;
    }
    .activities-header h1 {
      font-size: 2.5rem;
      font-weight: bold;
    }
    .activities-header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }
    .activity-item {
      background-color: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 1rem;
      padding: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .activity-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .activity-icon {
      color: #2575fc;
      font-size: 1.5rem;
      margin-right: 1rem;
    }
    .activity-title {
      font-size: 1.2rem;
      color: #333;
      font-weight: 500;
    }
    .modal-content {
      border-radius: 10px;
      border: none;
    }
    .modal-header {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }
    .modal-title {
      font-weight: bold;
    }
    .carousel-control-prev-icon,
    .carousel-control-next-icon {
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="activities-header text-center">
      <h1 class="display-4">🌟 School Activities 🌟</h1>
      <p class="lead">Discover the fun and exciting activities at ZPPS Kavathe School!</p>
    </div>

    <div class="list-group activities-list">
      {% for activity in activities %}
      <a href="#" class="list-group-item list-group-item-action activity-item" data-toggle="modal" data-target="#imageModalFinal" data-images="{{ activity.images }}" data-title="{{ activity.title }}">
        <div class="d-flex align-items-center">
          <i class="fas fa-calendar-alt activity-icon"></i>
          <span class="activity-title">{{ activity.title }}</span>
        </div>
      </a>
      {% endfor %}
    </div>

    <!-- Modal -->
    <div class="modal fade" id="imageModalFinal" tabindex="-1" role="dialog" aria-labelledby="imageModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="imageModalLabel">Activity Details</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body">
            <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
              <div class="carousel-inner" id="carousel-inner">
                <!-- Dynamic content will be injected here -->
              </div>
              <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="sr-only">Previous</span>
              </a>
              <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="sr-only">Next</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>

    <script>
      $('#imageModalFinal').on('show.bs.modal', function (event) {
        var button = $(event.relatedTarget);
        var images = button.data('images').split(',');
        var title = button.data('title');

        var modal = $(this);
        modal.find('.modal-title').text(title);

        var carouselInner = modal.find('#carousel-inner');
        carouselInner.empty();

        images.forEach((image, index) => {
          var imgSrc = "{% static '' %}" + image.trim();
          var imgElement = `
            <div class="carousel-item ${index === 0 ? 'active' : ''}">
              <img class="d-block w-100 mb-2" src="${imgSrc}" alt="${title}">
            </div>
          `;
          carouselInner.append(imgElement);
        });
      });
    </script>
  </div>
</body>
{% endblock %}
