{% extends 'template/base.html' %}
{% load static %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #667eea, #764ba2);">
    <div style="width: 350px; padding: 20px; background: rgba(255, 255, 255, 0.2); border-radius: 15px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px); text-align: center;">
        <h2 style="color: white; font-family: Arial, sans-serif; margin-bottom: 15px;">Login</h2>
        <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required style="padding: 10px; width: 100%; border: none; border-radius: 5px; outline: none; font-size: 16px;">
            <input type="password" name="password" placeholder="Password" required style="padding: 10px; width: 100%; border: none; border-radius: 5px; outline: none; font-size: 16px;">
            <button type="submit" style="padding: 10px; background: #ff6f61; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; transition: 0.3s;">
                Login
            </button>
        </form>
        <a href="#" style="color: white; display: block; margin-top: 10px; font-size: 14px; text-decoration: none;">Forgot Password?</a>
    </div>
</div>
{% endblock %}
