{% extends 'template/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="display-4 mb-3" style="font-weight: 700; color: #343a40;">Upload New E-Book</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg" style="border-radius: 15px; overflow: hidden; transition: transform 0.3s ease, box-shadow 0.3s ease;">
                <div class="card-body" style="padding: 30px;">
                    <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 20px;">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary btn-lg" style="background-color: #007bff; border-color: #007bff; transition: background-color 0.3s ease, transform 0.3s ease;">
                            Upload
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Card Hover Animation */
    .card:hover {
        transform: scale(1.02);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    /* Button Hover Animation */
    .btn-primary:hover {
        background-color: #0056b3;
        border-color: #0056b3;
        transform: scale(1.05);
    }

    /* Button Focus Animation */
    .btn-primary:focus {
        box-shadow: 0 0 0 0.2rem rgba(38, 143, 255, 0.5);
    }
</style>
{% endblock %}
