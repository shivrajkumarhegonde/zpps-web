{% extends 'template/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="display-4 mb-3">Delete E-Book</h1>
        <p>Are you sure you want to delete the E-Book "{{ ebook.title }}"?</p>
    </div>
    
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger btn-lg">Yes, Delete</button>
                <a href="{% url 'ebook_list' %}" class="btn btn-secondary btn-lg">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
